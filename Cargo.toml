[package]
name = "bruce-graphql"
version = "0.6.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Bruce's GraphQL CodeGen: the runtime for the typed Rust which bruce-graphql-builder generates from a GraphQL schema and queries"
repository = "https://github.com/bruceskingle/bruce-graphql"
readme = "README.md"
keywords = ["graphql", "codegen", "client"]
categories = ["web-programming::http-client"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.bruce-method]
kind = "crate"

[workspace]
members = ["bruce-graphql-builder", "bruce-graphql-builder-test"]

[dev-dependencies]
trybuild = "1.0"

[dependencies]
display_json = "0.2.1"
once_cell = "1.19.0"
reqwest = { version = "0.12.7", default-features = false, features = ["json", "rustls-tls", "charset", "http2", "macos-system-configuration"] }
serde = { version = "1.0.210", features = ["derive"]}
serde_json = "1.0.128"
time = { version = "0.3.36", features = ["serde", "parsing", "formatting"] }
time-tz = "2.0.0"
indexmap = { version = "2.7.0", features = ["serde"] }
iso_currency = "0.7.1"
